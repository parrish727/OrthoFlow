[databases]
orthoflow = host=postgres port=5432 dbname=orthoflow user=orthoflow password=changeme

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 80
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,search_path
admin_users = orthoflow
stats_users = orthoflow
